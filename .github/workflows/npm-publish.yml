name: Publish npm Package

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/pi-gmi-cloud
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Update npm
        run: npm install --global npm@latest

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}"
            exit 1
          fi

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Resolve registry state
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"

          if ! npm view "${package_spec}" version >/dev/null 2>&1; then
            echo "needs_publish=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          published_git_head="$(npm view "${package_spec}" gitHead 2>/dev/null || true)"
          if [[ -z "${published_git_head}" || "${published_git_head}" != "${GITHUB_SHA}" ]]; then
            echo "${package_spec} already exists but was not published from ${GITHUB_SHA}"
            exit 1
          fi

          echo "${package_spec} is already published from ${GITHUB_SHA}"
          echo "needs_publish=false" >> "${GITHUB_OUTPUT}"

      - name: Publish package
        if: steps.registry.outputs.needs_publish == 'true'
        run: npm publish
