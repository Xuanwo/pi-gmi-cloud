name: Publish npm Package

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/pi-gmi-cloud
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Update npm
        run: npm install --global npm@latest

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}"
            exit 1
          fi

      - name: Inspect package contents
        id: package
        shell: bash
        run: |
          set -euo pipefail
          pack_json="$(npm pack --dry-run --json)"
          echo "${pack_json}"
          integrity="$(
            node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const [pack] = JSON.parse(input);
                if (!pack?.integrity) {
                  throw new Error("npm pack did not return integrity");
                }
                process.stdout.write(pack.integrity);
              });
            ' <<< "${pack_json}"
          )"
          echo "integrity=${integrity}" >> "${GITHUB_OUTPUT}"

      - name: Resolve registry state
        id: registry
        shell: bash
        env:
          LOCAL_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"

          if ! published_integrity="$(npm view "${package_spec}" dist.integrity 2>/dev/null)"; then
            echo "needs_publish=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ -z "${published_integrity}" || "${published_integrity}" != "${LOCAL_INTEGRITY}" ]]; then
            echo "${package_spec} already exists with different package contents"
            exit 1
          fi

          echo "${package_spec} is already published with the same package contents"
          echo "needs_publish=false" >> "${GITHUB_OUTPUT}"

      - name: Publish package
        if: steps.registry.outputs.needs_publish == 'true'
        run: npm publish
